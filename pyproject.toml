[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dubblm"
version = "0.1.0"
description = "AI-assisted video dubbing pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "ArteusAI"}
]
license = {text = "Proprietary"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent"
]
dependencies = [
    "json-repair==0.41.0",
    "google-genai==1.16.1",
    "llama-index-llms-google-genai==0.9.1",
    "deepgram-sdk==5.3.2",
]

[project.urls]
Homepage = "https://github.com/ArteusAI/DubbLM"

[project.scripts]
dubblm = "dubbing.cli.main:main"
dubblm-gradio = "dubbing.ui.gradio_app:main"
dubblm-web = "dubbing.web.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["google_vertex"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dubbing*", "transcription*", "translation*", "tts*", "utils*"]
